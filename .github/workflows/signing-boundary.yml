name: Test signing environment boundary
on:
  workflow_dispatch:
permissions: {}
jobs:
  untrusted-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check that an ordinary job cannot access the canary
        env:
          CANARY: ${{ secrets.SIGNING_BOUNDARY_CANARY }}
        run: test -z "$CANARY"
  signing-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: signing-boundary-proof
    steps:
      - name: Check that GitHub released the dummy canary
        env:
          CANARY: ${{ secrets.SIGNING_BOUNDARY_CANARY }}
        run: test -n "$CANARY"
