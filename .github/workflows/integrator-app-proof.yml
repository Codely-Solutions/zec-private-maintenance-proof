name: Prove scoped App integration
on:
  workflow_dispatch:
permissions: {}
concurrency: scoped-app-proof
jobs:
  denied:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject generic workflow token on protected main
        run: |
          git -c user.name=Proof -c user.email=proof@example.invalid commit --allow-empty -m 'Rejected sandbox marker'
          if result=$(git push origin HEAD:refs/heads/main 2>&1); then exit 1; fi
          grep -E 'GH013|Cannot update this protected ref' <<< "$result"
  admitted:
    needs: denied
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: integration-boundary-proof
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: installation
        with:
          client-id: Iv23lik3K6p93iDL148Q
          private-key: ${{ secrets.INTEGRATION_PROOF_KEY }}
          owner: Codely-Solutions
          repositories: zec-private-maintenance-proof
          permission-contents: write
      - name: Verify the installation and reject administration access
        env:
          GH_TOKEN: ${{ steps.installation.outputs.token }}
        run: |
          scope=$(gh api installation/repositories --jq '[.repositories[].full_name] | join(",")')
          test "$scope" = Codely-Solutions/zec-private-maintenance-proof
          if result=$(gh api "repos/$GITHUB_REPOSITORY/actions/secrets" 2>&1); then exit 1; fi
          grep -E 'HTTP 403|Resource not accessible' <<< "$result"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.installation.outputs.token }}
      - name: Integrate a sandbox-only marker through the App
        run: |
          git -c user.name=Proof -c user.email=proof@example.invalid commit --allow-empty -m 'Verified sandbox App integration'
          git push origin HEAD:refs/heads/main
